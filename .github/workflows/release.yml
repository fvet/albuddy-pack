name: Release

# Started by hand from the Actions tab, on main. Every Marketplace submission is
# a deliberate act, so there is no tag trigger — the version bump, the tag and
# the .vsix are all produced in this one run and therefore cannot disagree.
#
# The notes people read are written by hand under '## Unreleased' in
# CHANGELOG.md as the changes land, so deciding what is worth mentioning happens
# in the pull request that caused it. This workflow only dates that section and
# opens an empty one for the next release. Generated notes were the alternative
# and they read like the commit log: dependency bumps and CI fixes in front of
# users, in wording aimed at whoever wrote the code.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise'
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: 'Exact version instead (e.g. 0.2.0) — overrides the choice above'
        type: string
        default: ''
      publish:
        description: 'How far to go'
        type: choice
        default: publish
        options:
          - publish       # bump, tag, GitHub release, and push to the Marketplace
          - package-only  # bump, tag, GitHub release — but do not touch the Marketplace
          - dry-run       # build and version-check the .vsix only; nothing leaves the runner

permissions:
  contents: write

# Two releases at once would race on the version in main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Release from main only
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -ne 'main') {
            throw "Releases are cut from main; this run is on '$env:REF_NAME'."
          }

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Work out the next version
        id: version
        shell: pwsh
        env:
          # Through env, not interpolated into the script: an input is data.
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $current = [string]$pkg.version
          $explicit = "$env:EXPLICIT".Trim()

          if ($explicit) {
            $next = $explicit
          } else {
            $parts = @($current -split '\.' | ForEach-Object { [int]$_ })
            while ($parts.Count -lt 3) { $parts += 0 }
            switch ($env:BUMP) {
              'major' { $parts[0]++; $parts[1] = 0; $parts[2] = 0 }
              'minor' { $parts[1]++; $parts[2] = 0 }
              default { $parts[2]++ }
            }
            $next = ($parts[0..2]) -join '.'
          }

          # vsce expects a plain X.Y.Z with no pre-release suffix.
          if ($next -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Version '$next' must be X.Y.Z with no leading zeros or suffix."
          }

          # The Marketplace refuses a version it already holds, so going
          # backwards would waste a number that cannot be reused.
          $ordinal = { param($v) ($v -split '\.' | ForEach-Object { '{0:00000}' -f [int]$_ }) -join '' }
          if ((& $ordinal $next) -le (& $ordinal $current)) {
            throw "Version $next is not above the current $current."
          }

          Write-Host "$current -> $next"
          "current=$current" | Out-File $env:GITHUB_OUTPUT -Append
          "next=$next" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Write it into package.json
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'package.json'
          $raw = [System.IO.File]::ReadAllText($path)
          # Only the version field: rewriting through ConvertTo-Json would
          # reorder and reformat everything around it.
          $pattern = '("version"\s*:\s*")[^"]*(")'
          $hits = ([regex]$pattern).Matches($raw).Count
          if ($hits -ne 1) { throw "Expected one version field in package.json, found $hits." }
          $updated = [regex]::Replace($raw, $pattern, '${1}${{ steps.version.outputs.next }}${2}')
          # WriteAllText gives UTF-8 without a BOM; Set-Content would add one.
          [System.IO.File]::WriteAllText($path, $updated)

      - name: Close off the changelog
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'CHANGELOG.md'
          $raw = [System.IO.File]::ReadAllText($path)
          $nl = if ($raw -match "`r`n") { "`r`n" } else { "`n" }

          # The new version lands below this marker; Unreleased stays above it.
          # Matching on the marker as well means one that was moved or lost fails
          # the release rather than quietly writing notes on the wrong side.
          $marker = '<!-- --8<-- [start:released] -->'
          $pattern = '(?ms)^## Unreleased[ \t]*\r?$(.*?)^' + [regex]::Escape($marker) + '[ \t]*\r?\n'
          $section = [regex]::Match($raw, $pattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md needs a '## Unreleased' section followed by the line '$marker'."
          }

          $notes = $section.Groups[1].Value.Trim()
          if (-not $notes) {
            # Not a failure: a release can be worth cutting for a dependency or
            # a Marketplace requirement with nothing to show for it.
            $notes = 'Maintenance release - nothing that changes what you see.'
            Write-Host '::warning::Nothing under Unreleased; the notes say so.'
          }

          # Built from the code point so the encoding this script is handed
          # cannot turn the em dash into mojibake.
          $dash = [char]0x2014
          $heading = "## ${{ steps.version.outputs.next }} $dash $(Get-Date -Format 'yyyy-MM-dd')"

          # Substring surgery rather than [regex]::Replace: a '$1' written in a
          # changelog entry would otherwise be read as a capture group.
          $replacement = "## Unreleased$nl$nl$marker$nl$nl$heading$nl$nl$notes$nl"
          $updated = $raw.Substring(0, $section.Index) + $replacement +
            $raw.Substring($section.Index + $section.Length)
          [System.IO.File]::WriteAllText($path, $updated)

          # The body of the GitHub release. Written to the runner's temp so the
          # commit below cannot pick it up.
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'release-notes.md'), $notes)
          Write-Host $heading

      - name: Package
        run: npx --yes @vscode/vsce package --out "albuddy-pack-${{ steps.version.outputs.next }}.vsix"

      # Cheap guard against a slip in the rewrite above: what is in the .vsix is
      # what reaches the Marketplace, so that is what gets checked.
      - name: Package must declare the new version
        shell: pwsh
        run: |
          $expected = '${{ steps.version.outputs.next }}'
          $json = (unzip -p "albuddy-pack-$expected.vsix" 'extension/package.json') -join "`n"
          $packaged = ($json | ConvertFrom-Json).version
          if ($packaged -ne $expected) {
            throw "The package declares $packaged, expected $expected."
          }
          Write-Host "Package declares $packaged."

      - uses: actions/upload-artifact@v7
        with:
          name: albuddy-pack-vsix
          path: albuddy-pack-*.vsix

      # Only now does anything leave the runner: if the build or the check above
      # failed, main is untouched and the version is still free.
      - name: Commit and tag
        if: inputs.publish != 'dry-run'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.next }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m "Release v$version"
          git tag -a "v$version" -m "v$version"
          # Atomic: the branch and the tag land together or not at all.
          git push origin HEAD:main --follow-tags --atomic

      - name: Publish the GitHub release
        if: inputs.publish != 'dry-run'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.next }}
          name: v${{ steps.version.outputs.next }}
          files: albuddy-pack-${{ steps.version.outputs.next }}.vsix
          # The changelog section this run just dated, not a generated list of
          # merged pull requests. See 'Close off the changelog' above.
          body_path: ${{ runner.temp }}/release-notes.md

      # Last, because the Marketplace refuses to take the same version twice: a
      # failure anywhere earlier costs nothing, a failure here costs this number.
      - name: Publish to the Visual Studio Marketplace
        if: inputs.publish == 'publish'
        run: npx --yes @vscode/vsce publish --packagePath "albuddy-pack-${{ steps.version.outputs.next }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
